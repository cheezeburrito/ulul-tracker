function getAllWorkouts(){
  var deleted=getDeletedDefaults();var edited=getEditedDefaults();
  var defaults=DEFAULT_WORKOUTS.filter(function(w){return deleted.indexOf(w.id)===-1;}).map(function(w){return edited[w.id]?Object.assign({},w,edited[w.id],{isDefault:true,id:w.id}):w;});
  var all=defaults.concat(getCustomWorkouts());
  var order=getWorkoutOrder();
  if(order.length>0){
    all.sort(function(a,b){
      var ai=order.indexOf(a.id);var bi=order.indexOf(b.id);
      if(ai===-1)ai=9999;if(bi===-1)bi=9999;
      return ai-bi;
    });
  }
  return all;
}
function getNextWorkout(){
  const lastId=getLastWorkout();const order=['upper_a','lower_a','upper_b','lower_b'];

  if(!available.length){const all=getAllWorkouts();return all.length?all[0].id:null;}
  if(!lastId)return available[0];const idx=available.indexOf(lastId);
  return idx===-1?available[0]:available[(idx+1)%available.length];
}

/* REST TIMER: timestamp-based so it survives app backgrounding */
var restTimerEndTime=0;
function startRestTimer(){
  restTimerEndTime=Date.now()+getRestDuration()*1000;
  updateRestTimerDisplay();$('#restTimerOverlay').classList.add('visible');
  clearInterval(restTimerInterval);
  restTimerInterval=setInterval(function(){
    restTimerRemaining=Math.ceil((restTimerEndTime-Date.now())/1000);
    if(restTimerRemaining<=0){
      // Overtime mode: show negative timer
      if(restTimerRemaining===0){
        if(navigator.vibrate)navigator.vibrate([200,100,200]);
        // Send push notification if app is backgrounded
        if(document.hidden&&Notification&&Notification.permission==='granted'){
          try{new Notification('ULUL Tracker',{body:'Rest time is up! Get back to it.',icon:'https://cheezeburrito.github.io/ulul-tracker/preview.png',tag:'rest-timer'});}catch(e){}
        }
      }
      var over=Math.abs(restTimerRemaining);
      $('#restTimerDisplay').textContent='-'+formatTimer(over);
      $('#restTimerDisplay').classList.add('overtime');
      $('#restTimerSub').textContent='Rest time over!';
      return;
    }
    $('#restTimerDisplay').classList.remove('overtime');
    $('#restTimerSub').textContent='Tap to dismiss';
    updateRestTimerDisplay();
  },250);
}
function updateRestTimerDisplay(){
  restTimerRemaining=Math.max(0,Math.ceil((restTimerEndTime-Date.now())/1000));
  $('#restTimerDisplay').textContent=formatTimer(restTimerRemaining);
}
function adjustRestTimer(d){restTimerEndTime+=d*1000;updateRestTimerDisplay();}
function dismissRestTimer(){clearInterval(restTimerInterval);restTimerInterval=null;$('#restTimerOverlay').classList.remove('visible');}

/* PR DETECTION */
function getAllPRs(){
  var sessions=getSessions();var prs={};
  sessions.forEach(function(s){
    s.exercises.forEach(function(ex){
      ex.sets.forEach(function(set){
        if(!set.completed||!set.weight)return;
        var w=parseFloat(set.weight);if(isNaN(w)||w<=0)return;
        var key=ex.name;
        if(!prs[key]||w>prs[key].weight){prs[key]={weight:w,reps:set.reps,date:s.date,workoutName:s.workoutName};}
      });
    });
  });
  return prs;
}

function isNewPR(exerciseName,weight){
  if(!weight)return false;
  var w=parseFloat(weight);if(isNaN(w)||w<=0)return false;
  var prs=getAllPRs();
  return !prs[exerciseName]||w>prs[exerciseName].weight;
}

/* WEEKLY VOLUME: sets per week for last 4 weeks */
function getWeeklyVolume(){
  var sessions=getSessions();var now=new Date();var weeks=[];
  for(var i=3;i>=0;i--){
    var weekStart=new Date(now);weekStart.setDate(weekStart.getDate()-weekStart.getDay()-i*7);
    weekStart.setHours(0,0,0,0);
    var weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
    var sets=0;
    sessions.forEach(function(s){
      var d=new Date(s.date);
      if(d>=weekStart&&d<weekEnd){
        s.exercises.forEach(function(ex){sets+=ex.sets.filter(function(st){return st.completed;}).length;});
      }
    });
    var label;
    if(i===0)label='This wk';
    else if(i===1)label='Last wk';
    else label=i+'w ago';
    weeks.push({sets:sets,label:label,current:i===0});
  }
  return weeks;
}

/* STREAK (for Today tab) */
function getCurrentStreak(){
  var sessions=getSessions();if(!sessions.length)return 0;
  var dateSet={};
  sessions.forEach(function(s){
    var d=new Date(s.date);
    dateSet[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]=true;
  });
  var streak=0;var check=new Date();check.setHours(0,0,0,0);
  var todayStr=check.getFullYear()+'-'+String(check.getMonth()+1).padStart(2,'0')+'-'+String(check.getDate()).padStart(2,'0');
  if(!dateSet[todayStr])check.setDate(check.getDate()-1);
  while(true){
    var cs=check.getFullYear()+'-'+String(check.getMonth()+1).padStart(2,'0')+'-'+String(check.getDate()).padStart(2,'0');
    if(dateSet[cs]){streak++;check.setDate(check.getDate()-1);}else break;
  }
  return streak;
}

function beginSession(wid,version){
  var allW=getAllWorkouts();var w=allW.find(function(x){return x.id===wid;});if(!w)return;
  var template;if(version==='custom'&&w.exercises)template=w.exercises;else template=w[version]||w.short||w.optimal||[];
  var flags=getFlags();
  activeSession={workoutId:w.id,workoutName:w.name,version:version,startTime:new Date().toISOString(),
    exercises:template.map(function(ex){
      var flagKey=w.id+'::'+ex.name;var flag=flags[flagKey]||null;
      var prev=getPreviousExerciseData(ex.name,w.id);
      return{id:generateId(),name:ex.name,targetReps:ex.reps,targetSets:ex.sets||2,
        notes:'',flagUp:false,flagDown:false,prevFlag:flag,
        sets:Array.from({length:ex.sets||2},function(_,i){
          var ps=prev&&prev.sets&&prev.sets[i]?prev.sets[i]:null;
          return{weight:ps?ps.weight:'',reps:'',rir:i===0?1:0,failure:i===1,completed:false,_autofilled:!!ps};
        })};
    })};
  startSessionTimer();persistSession();renderActiveSession();
  // Request notification permission for rest timer alerts
  if(Notification&&Notification.permission==='default'){Notification.requestPermission();}
}

/* ACTIVE SESSION */
function renderActiveSession(){
  if(!activeSession){renderToday();return;}
  var container=$('#tab-today');
  var totalSets=activeSession.exercises.reduce(function(a,e){return a+e.sets.length;},0);
  var doneSets=activeSession.exercises.reduce(function(a,e){return a+e.sets.filter(function(s){return s.completed;}).length;},0);
  var pct=totalSets>0?(doneSets/totalSets):0;var circ=2*Math.PI*13;
  var html='<div class="session-header"><div><div class="sh-subtitle">'+activeSession.version.charAt(0).toUpperCase()+activeSession.version.slice(1)+' &middot; Started '+formatTime(activeSession.startTime)+'</div><div class="session-timer" id="sessionElapsed">'+formatElapsed(activeSession.startTime)+'</div></div><div class="session-progress"><svg class="progress-ring" viewBox="0 0 32 32"><circle class="bg" cx="16" cy="16" r="13"/><circle class="fg" cx="16" cy="16" r="13" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ*(1-pct)+'" transform="rotate(-90 16 16)"/></svg>'+doneSets+'/'+totalSets+'</div></div>';

  activeSession.exercises.forEach(function(ex,exIdx){
    var allDone=ex.sets.every(function(s){return s.completed;});
    var prev=getPreviousExerciseData(ex.name,activeSession.workoutId);
    var hasPR=ex.sets.some(function(s){return s.completed&&s.weight&&isNewPR(ex.name,s.weight);});
    html+='<div class="exercise-card '+(allDone?'all-done':'')+'">';
    html+='<div class="ex-header"><div class="ex-header-left"><div class="ex-name">'+(ex.prevFlag==='up'?'<span class="flag-arrow flag-up">▲</span>':'')+(ex.prevFlag==='down'?'<span class="flag-arrow flag-down">▼</span>':'')+ex.name+(hasPR?'<span class="pr-badge">★ PR</span>':'')+'</div><div class="ex-rep-range">'+ex.targetSets+' × '+ex.targetReps+' &middot; 2 sets to failure</div></div><div class="ex-header-actions"><div class="reorder-btns"><button class="reorder-btn" onclick="moveExercise('+exIdx+',-1)" '+(exIdx===0?'disabled':'')+'>▲</button><button class="reorder-btn" onclick="moveExercise('+exIdx+',1)" '+(exIdx===activeSession.exercises.length-1?'disabled':'')+'>▼</button></div><button class="ex-icon-btn" onclick="showSwapModal('+exIdx+')" title="Swap">⇄</button></div></div>';
    if(prev){var ps=prev.sets.map(function(s){return(s.weight||'?')+'×'+(s.reps||'?');}).join(', ');html+='<div class="ex-prev">Last: <span>'+ps+'</span></div>';}
    html+='<div class="set-table"><div class="set-row-header"><div>Set</div><div>Weight</div><div>Reps</div><div>RIR</div><div style="text-align:center">F</div><div style="text-align:center">✓</div></div>';
    ex.sets.forEach(function(set,setIdx){
      var rc='rir-'+Math.min(set.rir,4);var rl=set.rir>=4?'4+':set.rir.toString();
      var af=set._autofilled&&set.weight&&!set.completed?'autofilled':'';
      html+='<div class="set-row '+(set.completed?'completed':'')+'" id="set-'+exIdx+'-'+setIdx+'"><div class="set-num">'+(setIdx+1)+'</div><input type="number" class="set-input '+af+'" value="'+set.weight+'" placeholder="lbs" onchange="updateSet('+exIdx+','+setIdx+',\'weight\',this.value)" onfocus="clearAutofill(this)" inputmode="decimal"><input type="number" class="set-input" value="'+set.reps+'" placeholder="'+ex.targetReps+'" onchange="updateSet('+exIdx+','+setIdx+',\'reps\',this.value)" inputmode="numeric"><button class="rir-btn '+rc+'" onclick="cycleRIR('+exIdx+','+setIdx+')">'+rl+'</button><button class="fail-check '+(set.failure?'checked':'')+'" onclick="toggleFailure('+exIdx+','+setIdx+')">'+(set.failure?'✕':'')+'</button><button class="done-check '+(set.completed?'checked':'')+'" onclick="toggleComplete('+exIdx+','+setIdx+')">'+(set.completed?'✓':'')+'</button></div>';
    });
    html+='</div>';
    html+='<div class="ex-footer"><button class="ex-footer-btn btn-add-set" onclick="addSet('+exIdx+')">+ Set</button>'+(ex.sets.length>1?'<button class="ex-footer-btn btn-rm-set" onclick="removeSet('+exIdx+')">- Set</button>':'')+'<button class="ex-footer-btn btn-flag-up '+(ex.flagUp?'active':'')+'" onclick="toggleFlag('+exIdx+',\'up\')">▲ Up</button><button class="ex-footer-btn btn-flag-down '+(ex.flagDown?'active':'')+'" onclick="toggleFlag('+exIdx+',\'down\')">▼ Down</button><button class="ex-footer-btn btn-notes-toggle" onclick="toggleNotes('+exIdx+')">📝</button>'+(activeSession.exercises.length>1?'<button class="ex-footer-btn btn-rm-set" onclick="deleteExercise('+exIdx+')" style="margin-left:auto;background:var(--red-dim);color:var(--red)">✕ Remove</button>':'')+'</div><div class="ex-notes-area '+(ex.showNotes?'visible':'')+'" id="notes-area-'+exIdx+'"><textarea placeholder="Notes..." onchange="updateNotes('+exIdx+',this.value)">'+(ex.notes||'')+'</textarea></div>';
    html+='</div>';
  });
  html+='<div style="padding:16px 0 32px;display:flex;gap:10px"><button class="btn btn-green btn-block" onclick="saveSession()" style="flex:2">Save Session</button><button class="btn btn-red btn-block" onclick="discardSession()" style="flex:1">Discard</button></div>';
  container.innerHTML=html;$('#pageTitle').textContent=activeSession.workoutName;$('#headerActions').innerHTML='<button class="header-btn" onclick="discardSession()">Cancel</button>';
}

/* SET HANDLERS */
function updateSet(ei,si,f,v){if(!activeSession)return;activeSession.exercises[ei].sets[si][f]=v;activeSession.exercises[ei].sets[si]._autofilled=false;persistSession();}
function clearAutofill(el){el.classList.remove('autofilled');}
function cycleRIR(ei,si){if(!activeSession)return;activeSession.exercises[ei].sets[si].rir=(activeSession.exercises[ei].sets[si].rir+1)%5;persistSession();renderActiveSession();}
function toggleFailure(ei,si){if(!activeSession)return;var s=activeSession.exercises[ei].sets[si];s.failure=!s.failure;if(s.failure)s.rir=0;persistSession();renderActiveSession();}
function toggleComplete(ei,si){if(!activeSession)return;var s=activeSession.exercises[ei].sets[si];s.completed=!s.completed;if(s.completed){if(navigator.vibrate)navigator.vibrate(30);startRestTimer();}persistSession();renderActiveSession();}
function addSet(ei){if(!activeSession)return;activeSession.exercises[ei].sets.push({weight:'',reps:'',rir:1,failure:false,completed:false,_autofilled:false});persistSession();renderActiveSession();}
function removeSet(ei){if(!activeSession)return;if(activeSession.exercises[ei].sets.length>1){activeSession.exercises[ei].sets.pop();persistSession();renderActiveSession();}}
function toggleFlag(ei,dir){if(!activeSession)return;var ex=activeSession.exercises[ei];if(dir==='up'){ex.flagUp=!ex.flagUp;if(ex.flagUp)ex.flagDown=false;}else{ex.flagDown=!ex.flagDown;if(ex.flagDown)ex.flagUp=false;}persistSession();renderActiveSession();}
function toggleNotes(ei){if(!activeSession)return;activeSession.exercises[ei].showNotes=!activeSession.exercises[ei].showNotes;var a=document.getElementById('notes-area-'+ei);if(a)a.classList.toggle('visible');}
function updateNotes(ei,v){if(!activeSession)return;activeSession.exercises[ei].notes=v;persistSession();}
function moveExercise(ei,dir){if(!activeSession)return;var ni=ei+dir;if(ni<0||ni>=activeSession.exercises.length)return;var a=activeSession.exercises;var tmp=a[ei];a[ei]=a[ni];a[ni]=tmp;persistSession();renderActiveSession();}
function deleteExercise(ei){
  if(!activeSession||activeSession.exercises.length<=1)return;
  var name=activeSession.exercises[ei].name;
  showConfirm('Remove '+name+'?','This exercise will be removed from the current session.',function(){
    activeSession.exercises.splice(ei,1);persistSession();renderActiveSession();showToast(name+' removed');
  },'Remove',true);
}

/* SWAP MODAL with search */
function showSwapModal(exIdx){
  openModal('<div class="modal-title">Swap Exercise</div><div style="margin-bottom:12px"><input type="text" id="swapSearch" placeholder="Search or type custom name..." style="font-size:15px" oninput="filterSwapList('+exIdx+')"></div><div id="swapResults"></div>');
  setTimeout(function(){filterSwapList(exIdx);},50);
}
function filterSwapList(exIdx){
  var input=document.getElementById('swapSearch');var q=(input?input.value:'').trim();var ql=q.toLowerCase();
  var container=document.getElementById('swapResults');if(!container)return;
  var html='';
  if(q&&!COMMON_EXERCISES.some(function(n){return n.toLowerCase()===ql;})){
    html+='<div class="swap-item" style="color:var(--accent);font-weight:600" onclick="swapExercise('+exIdx+',\''+q.replace(/'/g,"\\'")+'\')">Use &quot;'+q+'&quot; as custom</div>';
  }
  var filtered=ql?COMMON_EXERCISES.filter(function(n){return n.toLowerCase().indexOf(ql)!==-1;}):COMMON_EXERCISES;
  html+='<div class="swap-list">';
  filtered.forEach(function(name){html+='<div class="swap-item" onclick="swapExercise('+exIdx+',\''+name.replace(/'/g,"\\'")+'\')">'+name+'</div>';});
  html+='</div>';container.innerHTML=html;
}
function swapExercise(ei,name){if(!activeSession)return;activeSession.exercises[ei].name=name;closeModal();persistSession();renderActiveSession();showToast('Exercise swapped');}

/* SAVE / DISCARD */
function saveSession(){
  if(!activeSession)return;stopSessionTimer();var flags=getFlags();
  activeSession.exercises.forEach(function(ex){var k=activeSession.workoutId+'::'+ex.name;if(ex.flagUp)flags[k]='up';else if(ex.flagDown)flags[k]='down';else delete flags[k];});
  saveFlags(flags);
  var session={id:generateId(),workoutId:activeSession.workoutId,workoutName:activeSession.workoutName,version:activeSession.version,date:new Date().toISOString(),startTime:activeSession.startTime,
    exercises:activeSession.exercises.map(function(ex){return{name:ex.name,notes:ex.notes||'',flagUp:ex.flagUp,flagDown:ex.flagDown,sets:ex.sets.map(function(s){return{weight:s.weight,reps:s.reps,rir:s.rir,failure:s.failure,completed:s.completed};})};})};
  var sessions=getSessions();sessions.push(session);saveSessions(sessions);setLastWorkout(activeSession.workoutId);
  activeSession=null;clearPersistedSession();if(navigator.vibrate)navigator.vibrate([50,30,50]);showToast('Session saved!');
  fbPush();
  renderToday();$('#pageTitle').textContent='Today';$('#headerActions').innerHTML='';
}
function discardSession(){showConfirm('Discard Session?','All progress will be lost.',function(){stopSessionTimer();activeSession=null;clearPersistedSession();renderToday();$('#pageTitle').textContent='Today';$('#headerActions').innerHTML='';showToast('Session discarded');},'Discard',true);}

/* HISTORY TAB */
function renderHistory(){
  var container=$('#tab-history');var sessions=getSessions();
  var opts='';var names={};sessions.forEach(function(s){names[s.workoutName]=1;});Object.keys(names).forEach(function(n){opts+='<option value="'+n+'">'+n+'</option>';});
  container.innerHTML='<div class="history-filters"><input type="text" id="histSearch" placeholder="Search exercise..." oninput="filterHistory()" style="flex:1"><select id="histFilter" onchange="filterHistory()" style="flex:1"><option value="">All Workouts</option>'+opts+'</select></div><div id="historyList"></div>';
  filterHistory();
}
function filterHistory(){
  var sessions=getSessions();var search=(document.getElementById('histSearch')?document.getElementById('histSearch').value:'').toLowerCase();
  var filter=document.getElementById('histFilter')?document.getElementById('histFilter').value:'';
  var filtered=sessions.slice().reverse();
  if(filter)filtered=filtered.filter(function(s){return s.workoutName===filter;});
  if(search)filtered=filtered.filter(function(s){return s.exercises.some(function(e){return e.name.toLowerCase().indexOf(search)!==-1;});});
  var container=document.getElementById('historyList');if(!container)return;
  if(!filtered.length){container.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><p>No sessions found</p></div>';return;}

  var prs=getAllPRs();
  var html='';
  filtered.forEach(function(s){
    // Compute session stats
    var totalSets=0,completedSets=0,totalVolume=0;
    s.exercises.forEach(function(ex){
      ex.sets.forEach(function(set){
        totalSets++;
        if(set.completed){completedSets++;var w=parseFloat(set.weight)||0;var r=parseInt(set.reps)||0;totalVolume+=w*r;}
      });
    });
    var duration='';
    if(s.startTime){var diff=Math.floor((new Date(s.date).getTime()-new Date(s.startTime).getTime())/1000);if(diff>0){var dm=Math.floor(diff/60);duration=dm+'m';}}

    html+='<div class="history-session" id="hist-'+s.id+'">';
    html+='<div class="history-session-header" onclick="toggleHistSession(\''+s.id+'\')">';
    html+='<div class="hs-left">';
    html+='<div class="hs-name">'+s.workoutName+' <span class="badge badge-blue">'+s.version+'</span></div>';
    html+='<div class="hs-date">'+formatDate(s.date)+' at '+formatTime(s.date)+'</div>';
    html+='<div class="hs-summary">';
    html+='<div class="hs-summary-item"><strong>'+completedSets+'</strong>/'+totalSets+' sets</div>';
    if(totalVolume>0)html+='<div class="hs-summary-item"><strong>'+totalVolume.toLocaleString()+'</strong> lbs vol</div>';
    html+='<div class="hs-summary-item"><strong>'+s.exercises.length+'</strong> exercises</div>';
    if(duration)html+='<div class="hs-summary-item"><strong>'+duration+'</strong></div>';
    html+='</div>';
    html+='</div>';
    html+='<div class="hs-chevron">›</div>';
    html+='</div>';

    html+='<div class="history-session-body">';
    s.exercises.forEach(function(ex){
      // Per-exercise volume
      var exVol=0;ex.sets.forEach(function(set){if(set.completed){exVol+=(parseFloat(set.weight)||0)*(parseInt(set.reps)||0);}});
      // Check if any set was a PR
      var bestWeight=0;ex.sets.forEach(function(set){if(set.completed&&set.weight){var w=parseFloat(set.weight);if(w>bestWeight)bestWeight=w;}});
      var isPR=bestWeight>0&&prs[ex.name]&&bestWeight>=prs[ex.name].weight;

      html+='<div class="hist-exercise">';
      html+='<div class="hist-ex-header"><div class="hist-ex-name">';
      if(ex.flagUp)html+='<span class="flag-arrow flag-up">▲</span>';
      if(ex.flagDown)html+='<span class="flag-arrow flag-down">▼</span>';
      html+=ex.name;
      if(isPR)html+='<span class="pr-badge">★ PR</span>';
      html+='</div>';
      if(exVol>0)html+='<div class="hist-ex-vol">'+exVol.toLocaleString()+' lbs</div>';
      html+='</div>';

      // Set grid
      html+='<div class="hist-set-grid">';
      html+='<div class="hist-set-grid-header"></div><div class="hist-set-grid-header">Weight</div><div class="hist-set-grid-header">Reps</div><div class="hist-set-grid-header">RIR</div><div class="hist-set-grid-header"></div>';
      ex.sets.forEach(function(set,i){
        var incClass=set.completed?'':'incomplete';
        var numClass=set.completed?'completed':'';
        var rirVal=set.rir>=4?'4+':set.rir;
        var rirClass='hist-rir-'+Math.min(set.rir,4);
        html+='<div class="hist-set-num '+numClass+'">'+(i+1)+'</div>';
        html+='<div class="hist-set-val '+incClass+'">'+(set.weight||'-')+' lbs</div>';
        html+='<div class="hist-set-val '+incClass+'">'+(set.reps||'-')+' reps</div>';
        html+='<div class="hist-rir-chip '+rirClass+'">'+rirVal+'</div>';
        html+='<div class="hist-fail-icon">'+(set.failure?'✕':'')+'</div>';
      });
      html+='</div>';

      if(ex.notes)html+='<div class="hist-notes">'+ex.notes+'</div>';
      html+='</div>';
    });
    html+='<button class="hist-delete-btn" onclick="deleteSession(\''+s.id+'\')">Delete Session</button>';
    html+='</div></div>';
  });
  container.innerHTML=html;
}
function toggleHistSession(id){var el=document.getElementById('hist-'+id);if(el)el.classList.toggle('expanded');}
function deleteSession(id){showConfirm('Delete Session?','This cannot be undone.',function(){saveSessions(getSessions().filter(function(s){return s.id!==id;}));renderHistory();showToast('Session deleted');},'Delete',true);}

/* WORKOUTS TAB: multi-delete + editable defaults */
function renderWorkouts(){
  var container=$('#tab-workouts');var allW=getAllWorkouts();
  var html='';
  if(workoutSelectMode){html+='<div class="select-mode-bar"><div class="select-count">'+workoutSelected.size+' selected</div><div style="display:flex;gap:8px"><button class="btn btn-sm btn-secondary" onclick="cancelSelectMode()">Cancel</button><button class="btn btn-sm btn-red" onclick="deleteSelectedWorkouts()" '+(workoutSelected.size===0?'disabled':'')+'>Delete</button></div></div>';}

  html+='<div class="section-header">Workouts</div>';
  allW.forEach(function(w,i){
    var sel=workoutSelected.has(w.id);
    var detail=w.subtitle||(w.short?w.short.length+' exercises':(w.exercises?w.exercises.length+' exercises':''));
    html+='<div class="workout-list-item '+(sel?'selected':'')+'" onclick="'+(workoutSelectMode?'toggleWorkoutSelect(\''+w.id+'\')':'previewWorkout(\''+w.id+'\')')+'">';
    if(workoutSelectMode)html+='<button class="wli-checkbox '+(sel?'checked':'')+'" onclick="event.stopPropagation();toggleWorkoutSelect(\''+w.id+'\')">'+(sel?'✓':'')+'</button>';
    html+='<div class="wli-left"><div class="wli-name">'+w.name+(w.isDefault?' <span class="badge badge-blue" style="font-size:9px">DEFAULT</span>':'')+'</div><div class="wli-detail">'+detail+'</div></div>';
    if(!workoutSelectMode)html+='<div class="wli-actions"><div class="wli-reorder"><button class="wli-reorder-btn" onclick="event.stopPropagation();moveWorkout(\''+w.id+'\',-1)" '+(i===0?'disabled':'')+'>▲</button><button class="wli-reorder-btn" onclick="event.stopPropagation();moveWorkout(\''+w.id+'\',1)" '+(i===allW.length-1?'disabled':'')+'>▼</button></div><button class="ex-icon-btn" onclick="event.stopPropagation();editWorkout(\''+w.id+'\')" title="Edit">✎</button><button class="ex-icon-btn" onclick="event.stopPropagation();duplicateWorkout(\''+w.id+'\')" title="Duplicate">⧉</button></div>';
    html+='</div>';
  });

  html+='<div style="padding:16px 0;display:flex;gap:10px"><button class="btn btn-primary btn-block" onclick="openWorkoutBuilder()" style="flex:2">+ Create Workout</button><button class="btn btn-secondary btn-block" onclick="enterSelectMode()" style="flex:1">'+(workoutSelectMode?'Done':'Select')+'</button></div>';
  container.innerHTML=html;
}
function enterSelectMode(){workoutSelectMode=!workoutSelectMode;workoutSelected.clear();renderWorkouts();}
function cancelSelectMode(){workoutSelectMode=false;workoutSelected.clear();renderWorkouts();}
function toggleWorkoutSelect(id){if(workoutSelected.has(id))workoutSelected.delete(id);else workoutSelected.add(id);renderWorkouts();}
function moveWorkout(id,direction){
  var allW=getAllWorkouts();
  var order=allW.map(function(w){return w.id;});
  var idx=-1;for(var i=0;i<order.length;i++){if(order[i]===id){idx=i;break;}}
  if(idx===-1)return;
  var newIdx=idx+direction;
  if(newIdx<0||newIdx>=order.length)return;
  var tmp=order[idx];order[idx]=order[newIdx];order[newIdx]=tmp;
  saveWorkoutOrder(order);renderWorkouts();
}
function deleteSelectedWorkouts(){
  var count=workoutSelected.size;
  showConfirm('Delete '+count+' workout'+(count>1?'s':'')+'?','This cannot be undone.',function(){
    var deleted=getDeletedDefaults();var customs=getCustomWorkouts();var edited=getEditedDefaults();
    workoutSelected.forEach(function(id){if(DEFAULT_WORKOUTS.find(function(w){return w.id===id;})){if(deleted.indexOf(id)===-1)deleted.push(id);delete edited[id];}else{customs=customs.filter(function(w){return w.id!==id;});}});
    saveDeletedDefaults(deleted);saveEditedDefaults(edited);saveCustomWorkouts(customs);
    workoutSelectMode=false;workoutSelected.clear();renderWorkouts();showToast(count+' workout'+(count>1?'s':'')+' deleted');
  },'Delete',true);
}

function previewWorkout(id){
  var allW=getAllWorkouts();var w=allW.find(function(x){return x.id===id;});if(!w)return;
  var html='<div class="modal-title">'+w.name+'</div>';
  if(w.subtitle)html+='<p style="text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:16px">'+w.subtitle+'</p>';
  if(w.short){html+='<div class="section-header">Short Version</div>';w.short.forEach(function(ex){html+='<div style="padding:6px 0;font-size:14px">'+ex.name+' <span style="color:var(--text-secondary)">'+ex.sets+' × '+ex.reps+'</span></div>';});}
  if(w.optimal){html+='<div class="section-header" style="margin-top:16px">Optimal Version</div>';w.optimal.forEach(function(ex){html+='<div style="padding:6px 0;font-size:14px">'+ex.name+' <span style="color:var(--text-secondary)">'+ex.sets+' × '+ex.reps+'</span></div>';});}
  if(!w.short&&!w.optimal&&w.exercises){w.exercises.forEach(function(ex){html+='<div style="padding:6px 0;font-size:14px">'+ex.name+' <span style="color:var(--text-secondary)">'+ex.sets+' × '+ex.reps+'</span></div>';});}
  html+='<div style="margin-top:20px"><button class="btn btn-primary btn-block" onclick="closeModal();startWorkoutSelect(\''+w.id+'\')">Start This Workout</button></div>';
  openModal(html);
}

/* WORKOUT BUILDER */
var builderState=null;
function editWorkout(id){var allW=getAllWorkouts();var w=allW.find(function(x){return x.id===id;});if(!w)return;builderState=JSON.parse(JSON.stringify(w));builderState._editing=true;builderState._isDefault=!!w.isDefault;if(w.short&&w.short.length>0)builderState.hasVersions=true;renderBuilder();}
function openWorkoutBuilder(editId){
  if(editId){editWorkout(editId);return;}
  builderState={id:'custom_'+generateId(),name:'',subtitle:'',isDefault:false,hasVersions:false,short:[],optimal:[],exercises:[{name:'',sets:2,reps:'8-12'}],_editing:false,_isDefault:false};renderBuilder();
}
function renderBuilder(){
  var bs=builderState;var isV=bs.hasVersions||(bs.short&&bs.short.length>0&&bs._editing);
  var html='<div class="modal-title">'+(bs._editing?'Edit':'Create')+' Workout</div>';
  html+='<div style="margin-bottom:12px"><label class="label">Workout Name</label><input type="text" id="builderName" value="'+bs.name+'" placeholder="e.g. Push Day" onchange="builderState.name=this.value"></div>';
  html+='<div style="margin-bottom:12px"><label class="label">Subtitle (optional)</label><input type="text" id="builderSub" value="'+(bs.subtitle||'')+'" placeholder="e.g. Chest & Triceps" onchange="builderState.subtitle=this.value"></div>';
  html+='<div class="toggle-row" style="border-bottom:none;margin-bottom:12px"><span class="toggle-label">Short & Optimal versions</span><button class="toggle-switch '+(isV?'on':'')+'" onclick="toggleBuilderVersions()"></button></div>';
  if(isV){
    html+='<div class="section-header">Short Version</div>'+renderBuilderExercises(bs.short||[],'short')+'<button class="btn btn-secondary btn-sm" onclick="addBuilderExercise(\'short\')" style="margin-bottom:16px">+ Add Exercise</button>';
    html+='<div class="section-header">Optimal Version</div>'+renderBuilderExercises(bs.optimal||[],'optimal')+'<button class="btn btn-secondary btn-sm" onclick="addBuilderExercise(\'optimal\')" style="margin-bottom:16px">+ Add Exercise</button>';
  }else{
    html+='<div class="section-header">Exercises</div>'+renderBuilderExercises(bs.exercises||[],'exercises')+'<button class="btn btn-secondary btn-sm" onclick="addBuilderExercise(\'exercises\')" style="margin-bottom:16px">+ Add Exercise</button>';
  }
  html+='<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-secondary btn-block" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-block" onclick="saveBuilder()">Save</button></div>';
  openModal(html);
}
function renderBuilderExercises(exs,key){var html='';exs.forEach(function(ex,i){html+='<div class="builder-exercise"><button class="be-remove" onclick="removeBuilderExercise(\''+key+'\','+i+')">✕</button><div class="be-reorder"><button class="be-reorder-btn" onclick="moveBuilderExercise(\''+key+'\','+i+',-1)" '+(i===0?'disabled':'')+'>▲</button><button class="be-reorder-btn" onclick="moveBuilderExercise(\''+key+'\','+i+',1)" '+(i===exs.length-1?'disabled':'')+'>▼</button></div><div class="be-row"><input type="text" value="'+ex.name+'" placeholder="Exercise name" onchange="updateBuilderExercise(\''+key+'\','+i+',\'name\',this.value)" style="flex:1"></div><div class="be-row"><div style="flex:1"><label class="label">Sets</label><input type="number" value="'+ex.sets+'" min="1" max="10" onchange="updateBuilderExercise(\''+key+'\','+i+',\'sets\',parseInt(this.value))"></div><div style="flex:1"><label class="label">Reps</label><input type="text" value="'+ex.reps+'" placeholder="8-12" onchange="updateBuilderExercise(\''+key+'\','+i+',\'reps\',this.value)"></div></div></div>';});return html;}
function toggleBuilderVersions(){
  builderState.hasVersions=!builderState.hasVersions;
  if(builderState.hasVersions){if(!builderState.short||!builderState.short.length)builderState.short=builderState.exercises?builderState.exercises.slice():[{name:'',sets:2,reps:'8-12'}];if(!builderState.optimal||!builderState.optimal.length)builderState.optimal=builderState.exercises?builderState.exercises.slice():[{name:'',sets:2,reps:'8-12'}];}
  else{builderState.exercises=builderState.short&&builderState.short.length>0?builderState.short.slice():[{name:'',sets:2,reps:'8-12'}];}
  renderBuilder();
}
function addBuilderExercise(k){if(!builderState[k])builderState[k]=[];builderState[k].push({name:'',sets:2,reps:'8-12'});renderBuilder();}
function removeBuilderExercise(k,i){builderState[k].splice(i,1);renderBuilder();}
function moveBuilderExercise(k,i,dir){var arr=builderState[k];if(!arr)return;var ni=i+dir;if(ni<0||ni>=arr.length)return;var tmp=arr[i];arr[i]=arr[ni];arr[ni]=tmp;renderBuilder();}
function updateBuilderExercise(k,i,f,v){builderState[k][i][f]=v;}
function saveBuilder(){
  if(!builderState.name.trim()){showToast('Please enter a workout name');return;}
  var w={id:builderState.id,name:builderState.name.trim(),subtitle:builderState.subtitle||''};
  if(builderState.hasVersions){w.short=(builderState.short||[]).filter(function(e){return e.name.trim();});w.optimal=(builderState.optimal||[]).filter(function(e){return e.name.trim();});}
  else{w.exercises=(builderState.exercises||[]).filter(function(e){return e.name.trim();});}
  if(builderState._isDefault){var edited=getEditedDefaults();edited[builderState.id]=w;saveEditedDefaults(edited);}
  else{w.isDefault=false;var customs=getCustomWorkouts();var idx=-1;for(var ci=0;ci<customs.length;ci++){if(customs[ci].id===w.id){idx=ci;break;}}if(idx>=0)customs[idx]=w;else customs.push(w);saveCustomWorkouts(customs);}
  closeModal();renderWorkouts();showToast(builderState._editing?'Workout updated':'Workout created');builderState=null;
}
function duplicateWorkout(id){var allW=getAllWorkouts();var o=allW.find(function(w){return w.id===id;});if(!o)return;var c=JSON.parse(JSON.stringify(o));c.id='custom_'+generateId();c.name+=' (Copy)';c.isDefault=false;var customs=getCustomWorkouts();customs.push(c);saveCustomWorkouts(customs);renderWorkouts();showToast('Workout duplicated');}

  html+='<div class="settings-group"><div class="settings-row" onclick="openRestTimerSetting()"><span class="sr-label">Rest Timer Duration</span><span class="sr-value">'+rd+'s ›</span></div></div>';

/* FIREBASE UI HANDLERS */
function doFbSignIn(){fbSignIn().then(function(result){showToast('Signed in as '+result.user.displayName);renderSettings();}).catch(function(err){showToast('Error: '+err.code+' - '+err.message);});}
function doFbSignOut(){showConfirm('Sign Out?','Your cloud data stays safe. Sign back in anytime to restore.',function(){fbSignOut().then(function(){showToast('Signed out');renderSettings();});});}
async function doFbPush(){showToast('Syncing...');var ok=await fbPush();showToast(ok?'Synced to cloud!':'Sync failed');}
function doFbPull(){showConfirm('Restore from Cloud?','This will replace all local data with your cloud backup.',function(){fbPull().then(function(data){if(data){restoreAllData(data);restoreSession();showToast('Restored!');switchTab('today');}else{showToast('No cloud data found');}});});}
function resetDefaults(){showConfirm('Reset Default Workouts?','This restores all 4 defaults to their original state and resets workout order.',function(){saveDeletedDefaults([]);saveEditedDefaults({});saveWorkoutOrder([]);renderSettings();showToast('Defaults restored');});}
function openRestTimerSetting(){var c=getRestDuration();openModal('<div class="modal-title">Rest Timer</div><p style="text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:20px">Default rest duration between sets</p><div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px"><button class="btn btn-secondary" onclick="adjustRestSetting(-15)">-15s</button><div style="font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;width:80px;text-align:center" id="restSettingDisplay">'+c+'s</div><button class="btn btn-secondary" onclick="adjustRestSetting(15)">+15s</button></div><input type="range" id="restSettingSlider" min="30" max="300" step="15" value="'+c+'" oninput="updateRestSettingFromSlider(this.value)" style="width:100%;margin-bottom:20px;accent-color:var(--accent)"><button class="btn btn-primary btn-block" onclick="saveRestSetting()">Save</button>');}
function adjustRestSetting(d){var s=document.getElementById('restSettingSlider'),di=document.getElementById('restSettingDisplay');var v=parseInt(s.value)+d;v=Math.max(30,Math.min(300,v));s.value=v;di.textContent=v+'s';}
function updateRestSettingFromSlider(v){document.getElementById('restSettingDisplay').textContent=v+'s';}
function saveRestSetting(){setRestDuration(parseInt(document.getElementById('restSettingSlider').value));closeModal();renderSettings();showToast('Rest timer updated');}
function exportData(){
  var data={sessions:getSessions(),customWorkouts:getCustomWorkouts(),flags:getFlags(),restDuration:getRestDuration(),lastWorkout:getLastWorkout(),deletedDefaults:getDeletedDefaults(),editedDefaults:getEditedDefaults(),bodyWeight:getBodyWeightLog(),workoutOrder:getWorkoutOrder(),exportDate:new Date().toISOString(),version:'2.0'};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ulul-backup-'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(url);showToast('Data exported');
}
function importData(event){
  var file=event.target.files[0];if(!file)return;var reader=new FileReader();
  reader.onload=function(e){try{var data=JSON.parse(e.target.result);showConfirm('Import Data?','This replaces all current data.',function(){if(data.sessions)saveSessions(data.sessions);if(data.customWorkouts)saveCustomWorkouts(data.customWorkouts);if(data.flags)saveFlags(data.flags);if(data.restDuration)setRestDuration(data.restDuration);if(data.lastWorkout)setLastWorkout(data.lastWorkout);if(data.deletedDefaults)saveDeletedDefaults(data.deletedDefaults);if(data.editedDefaults)saveEditedDefaults(data.editedDefaults);if(data.bodyWeight)saveBodyWeightLog(data.bodyWeight);if(data.workoutOrder)saveWorkoutOrder(data.workoutOrder);showToast('Data imported');renderSettings();});}catch(err){showToast('Invalid file format');}};
  reader.readAsText(file);event.target.value='';
}
function clearAllData(){showConfirm('Clear All Data?','This permanently deletes everything.',function(){Object.keys(KEYS).forEach(function(k){localStorage.removeItem(KEYS[k]);});activeSession=null;clearPersistedSession();stopSessionTimer();showToast('All data cleared');switchTab('today');},'Clear Everything',true);}

/* CALENDAR TAB */
var calYear=new Date().getFullYear();
var calMonth=new Date().getMonth();
var calSelectedDate=null;

function renderCalendar(){
  var container=$('#tab-calendar');
  var sessions=getSessions();
  var now=new Date();
  var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  // Build session map: dateStr -> [sessions]
  var sessionMap={};
  sessions.forEach(function(s){
    var d=new Date(s.date);
    var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!sessionMap[key])sessionMap[key]=[];
    sessionMap[key].push(s);
  });

  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var firstDay=new Date(calYear,calMonth,1).getDay();
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();

  // Streak calculation
  var streak=0;
  var checkDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  // If no session today, start checking from yesterday
  var checkStr=checkDate.getFullYear()+'-'+String(checkDate.getMonth()+1).padStart(2,'0')+'-'+String(checkDate.getDate()).padStart(2,'0');
  if(!sessionMap[checkStr]){checkDate.setDate(checkDate.getDate()-1);}
  while(true){
    var cs=checkDate.getFullYear()+'-'+String(checkDate.getMonth()+1).padStart(2,'0')+'-'+String(checkDate.getDate()).padStart(2,'0');
    if(sessionMap[cs]){streak++;checkDate.setDate(checkDate.getDate()-1);}else{break;}
  }

  // Sessions this month count
  var monthSessions=0;
  for(var key in sessionMap){
    var parts=key.split('-');
    if(parseInt(parts[0])===calYear&&parseInt(parts[1])===calMonth+1)monthSessions+=sessionMap[key].length;
  }

  var html='';

  // Streak bar
  html+='<div class="cal-streak"><div class="cal-streak-num">'+streak+'</div><div><div class="cal-streak-label">Day Streak</div><div class="cal-streak-sub">'+monthSessions+' session'+(monthSessions!==1?'s':'')+' in '+monthNames[calMonth]+'</div></div></div>';

  // Nav
  html+='<div class="cal-nav"><button class="cal-nav-btn" onclick="calPrev()">‹</button><div class="cal-nav-title">'+monthNames[calMonth]+' '+calYear+'</div><button class="cal-nav-btn" onclick="calNext()">›</button></div>';

  // Grid
  html+='<div class="cal-grid">';
  var dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dows.forEach(function(d){html+='<div class="cal-dow">'+d+'</div>';});

  // Empty cells before first day
  for(var e=0;e<firstDay;e++){html+='<div class="cal-day empty"></div>';}

  // Day cells
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=dateStr===todayStr;
    var isSelected=dateStr===calSelectedDate;
    var hasSession=!!sessionMap[dateStr];
    var classes='cal-day';
    if(isToday)classes+=' today';
    if(isSelected)classes+=' selected';
    html+='<div class="'+classes+'" onclick="calSelectDay(\''+dateStr+'\')">';
    html+=d;
    if(hasSession)html+='<div class="cal-dot"></div>';
    html+='</div>';
  }
  html+='</div>';

  // Selected day detail
  if(calSelectedDate&&sessionMap[calSelectedDate]){
    var daySessions=sessionMap[calSelectedDate];
    daySessions.forEach(function(s){
      html+='<div class="cal-day-detail">';
      html+='<div class="cal-detail-header">'+s.workoutName+' <span class="badge badge-blue">'+s.version+'</span></div>';
      html+='<div class="cal-detail-sub">'+formatTime(s.date)+(s.startTime?' &middot; Started '+formatTime(s.startTime):'')+'</div>';
      s.exercises.forEach(function(ex){
        html+='<div class="cal-detail-ex-name">'+ex.name+'</div>';
        ex.sets.forEach(function(set,i){
          var rl=set.rir>=4?'4+':set.rir;
          html+='<div class="cal-detail-ex">Set '+(i+1)+': '+(set.weight||'-')+' lbs × '+(set.reps||'-')+', RIR '+rl+(set.failure?' ✕':'')+(set.completed?'':' (skip)')+'</div>';
        });
      });
      html+='</div>';
    });
  } else if(calSelectedDate&&!sessionMap[calSelectedDate]){
    html+='<div class="empty-state" style="padding:24px"><p>Rest day</p></div>';
  }

  container.innerHTML=html;
}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}calSelectedDate=null;renderCalendar();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}calSelectedDate=null;renderCalendar();}
function calSelectDay(dateStr){calSelectedDate=calSelectedDate===dateStr?null:dateStr;renderCalendar();}

/* ACCENT COLORS */
var ACCENT_COLORS=[
  {name:'Blue',value:'#0a84ff'},{name:'Purple',value:'#5e5ce6'},{name:'Green',value:'#30d158'},
  {name:'Red',value:'#ff453a'},{name:'Orange',value:'#ff9f0a'},{name:'Pink',value:'#ff375f'},
  {name:'Teal',value:'#64d2ff'},{name:'Yellow',value:'#ffd60a'}
];
function getAccentColor(){return localStorage.getItem(NS+'accent_color')||'#0a84ff';}
function setAccentColor(c){
  localStorage.setItem(NS+'accent_color',c);
  document.documentElement.style.setProperty('--accent',c);
  var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  document.documentElement.style.setProperty('--accent-dim','rgba('+r+','+g+','+b+',0.15)');
}
function applyAccent(){var c=getAccentColor();if(c!=='#0a84ff')setAccentColor(c);}
function renderAccentPicker(){
  var el=document.getElementById('accentPicker');if(!el)return;
  var cur=getAccentColor();
  el.innerHTML=ACCENT_COLORS.map(function(c){return '<div class="accent-swatch '+(c.value===cur?'active':'')+'" style="background:'+c.value+'" onclick="setAccentColor(\''+c.value+'\');renderSettings()" title="'+c.name+'"></div>';}).join('');
}

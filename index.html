*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

}

/* Convert every stored weight when switching units so numbers stay correct (not just relabeled) */
function convertStoredWeights(from,to){
  var f=(from==='lbs'&&to==='kg')?(1/2.2046226):(from==='kg'&&to==='lbs')?2.2046226:1;
  if(f===1)return;
  function cv(v){if(v===''||v==null)return v;var n=parseFloat(v);if(isNaN(n))return v;return Math.round(n*f*10)/10;}
  var sessions=getSessions();sessions.forEach(function(s){s.exercises.forEach(function(e){e.sets.forEach(function(st){st.weight=cv(st.weight);});});});saveSessions(sessions);
  var bw=getBodyWeightLog();bw.forEach(function(b){b.weight=cv(b.weight);});saveBodyWeightLog(bw);
  var bar=localStorage.getItem(NS+'bar_weight');if(bar)localStorage.setItem(NS+'bar_weight',cv(bar));
  if(typeof activeSession!=='undefined'&&activeSession){activeSession.exercises.forEach(function(e){e.sets.forEach(function(st){st.weight=cv(st.weight);});});persistSession();}
  if(typeof sbAutoSync==='function')sbAutoSync();
}

/* 1RM ESTIMATE (Epley formula) */
function calc1RM(weight,reps){
  var w=parseFloat(weight),r=parseInt(reps);
  if(!w||!r||r<=0||isNaN(w)||isNaN(r))return null;
  if(r===1)return Math.round(w);
  return Math.round(w*(1+r/30));
}

    activeSession=saved;
    startSessionTimer();requestWakeLock();

    var idleMs=Date.now()-new Date(lastActivity).getTime();

/* MERGE: union local + cloud so multi-device use never loses data */
function _mergeById(a,b){var m={};(a||[]).forEach(function(x){if(x&&x.id)m[x.id]=x;});(b||[]).forEach(function(x){if(x&&x.id)m[x.id]=x;});return Object.keys(m).map(function(k){return m[k];});}

function _mergeBodyWeight(a,b){var m={};(a||[]).concat(b||[]).forEach(function(e){if(e&&e.date)m[e.date+'|'+e.weight]=e;});var arr=Object.keys(m).map(function(k){return m[k];});arr.sort(function(x,y){return new Date(x.date)-new Date(y.date);});return arr;}
function _unionArr(a,b){var s={};(a||[]).concat(b||[]).forEach(function(x){s[x]=1;});return Object.keys(s);}
function mergeAllData(local,cloud){
  var newer=(new Date(cloud.syncDate||0)>new Date(local.syncDate||0))?cloud:local;
  return{
    sessions:_mergeSessions(local.sessions,cloud.sessions),
    customWorkouts:_mergeById(local.customWorkouts,cloud.customWorkouts),
    bodyWeight:_mergeBodyWeight(local.bodyWeight,cloud.bodyWeight),
    flags:Object.assign({},local.flags,cloud.flags),
    restDuration:newer.restDuration||local.restDuration,
    lastWorkout:newer.lastWorkout||local.lastWorkout,
    deletedDefaults:_unionArr(local.deletedDefaults,cloud.deletedDefaults),
    editedDefaults:Object.assign({},local.editedDefaults,newer.editedDefaults),
    workoutOrder:(newer.workoutOrder&&newer.workoutOrder.length)?newer.workoutOrder:(local.workoutOrder||cloud.workoutOrder||[]),
    activeSession:local.activeSession||cloud.activeSession||null,
    syncDate:new Date().toISOString(),version:'2.0'
  };
}

var _audioCtx=null;

function playAlarm(){
  try{
    var ctx=_getAudioCtx();
    // Three-beep pattern: 880Hz, 1046Hz, 1318Hz (ascending)
    [[0,880],[0.25,1046],[0.5,1318]].forEach(function(p){
      var o=ctx.createOscillator();var g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=p[1];o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+p[0]);
      g.gain.linearRampToValueAtTime(0.5,ctx.currentTime+p[0]+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+p[0]+0.35);
      o.start(ctx.currentTime+p[0]);o.stop(ctx.currentTime+p[0]+0.4);
    });
  }catch(e){}
}

  var ei=parseInt(_focusedInput.dataset.ei),si=parseInt(_focusedInput.dataset.si);
  if(!isNaN(ei)&&!isNaN(si))updateSet(ei,si,field,String(nv));
}
function focusNextInput(){

  var idx=inputs.indexOf(_focusedInput);
  if(idx>=0&&idx+1<inputs.length){var n=inputs[idx+1];n.focus();if(n.select)try{n.select();}catch(e){}}

/* SWIPE-TO-COMPLETE: swipe a set row right to mark done */
var _swipe=null;
document.addEventListener('touchstart',function(e){
  if(!activeSession)return;
  var t=e.target;
  if(t.tagName==='INPUT'||t.tagName==='BUTTON'||t.tagName==='TEXTAREA')return;
  var row=t.closest?t.closest('.set-row'):null;
  if(!row)return;
  _swipe={row:row,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0};
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!_swipe)return;
  var dx=e.touches[0].clientX-_swipe.x;var dy=e.touches[0].clientY-_swipe.y;
  if(Math.abs(dy)>Math.abs(dx)){_swipe=null;return;}
  if(dx>0){_swipe.dx=dx;_swipe.row.style.transition='none';_swipe.row.style.transform='translateX('+Math.min(dx,90)+'px)';}
},{passive:true});
document.addEventListener('touchend',function(){
  if(!_swipe)return;
  var row=_swipe.row,dx=_swipe.dx;
  row.style.transition='transform 0.2s';row.style.transform='';
  if(dx>60){var p=row.id.split('-');var ei=parseInt(p[1]),si=parseInt(p[2]);if(!isNaN(ei)&&!isNaN(si))toggleComplete(ei,si);}
  _swipe=null;
},{passive:true});

/* REST TIMER: timestamp-based so it survives app backgrounding */
var restTimerEndTime=0;
function startRestTimer(){
  restTimerEndTime=Date.now()+getRestDuration()*1000;
  updateRestTimerDisplay();$('#restTimerOverlay').classList.add('visible');
  clearInterval(restTimerInterval);
  restTimerInterval=setInterval(function(){
    restTimerRemaining=Math.ceil((restTimerEndTime-Date.now())/1000);
    if(restTimerRemaining<=0){
      // Overtime mode: show negative timer
      if(restTimerRemaining===0){
        playAlarm();
        flashScreen();
        if(navigator.vibrate)navigator.vibrate([200,100,200,100,200]);
        if(document.hidden&&Notification&&Notification.permission==='granted'){
          try{new Notification('ULUL Tracker',{body:'Rest time is up! Get back to it.',icon:'https://cheezeburrito.github.io/ulul-tracker/preview.png',tag:'rest-timer'});}catch(e){}
        }
      }
      var over=Math.abs(restTimerRemaining);
      $('#restTimerDisplay').textContent='-'+formatTimer(over);
      $('#restTimerDisplay').classList.add('overtime');
      $('#restTimerSub').textContent='Rest time over!';
      return;
    }
    $('#restTimerDisplay').classList.remove('overtime');
    $('#restTimerSub').textContent='Tap to dismiss';
    updateRestTimerDisplay();
  },250);
}
function updateRestTimerDisplay(){
  restTimerRemaining=Math.max(0,Math.ceil((restTimerEndTime-Date.now())/1000));
  $('#restTimerDisplay').textContent=formatTimer(restTimerRemaining);
}
function adjustRestTimer(d){restTimerEndTime+=d*1000;updateRestTimerDisplay();}
function setRestTimerTo(secs){restTimerEndTime=Date.now()+secs*1000;$('#restTimerDisplay').classList.remove('overtime');updateRestTimerDisplay();}
function dismissRestTimer(){clearInterval(restTimerInterval);restTimerInterval=null;$('#restTimerOverlay').classList.remove('visible');$('#restTimerDisplay').classList.remove('overtime');}
$('#restTimerOverlay').addEventListener('click',function(e){if(e.target===this)dismissRestTimer();});

/* PR DETECTION */
function getAllPRs(){
  var sessions=getSessions();var prs={};
  sessions.forEach(function(s){
    s.exercises.forEach(function(ex){
      ex.sets.forEach(function(set){
        if(!set.completed||!set.weight||set.warmup)return;
        var w=parseFloat(set.weight);if(isNaN(w)||w<=0)return;
        var key=ex.name;
        if(!prs[key]||w>prs[key].weight){prs[key]={weight:w,reps:set.reps,date:s.date,workoutName:s.workoutName};}
      });
    });
  });
  return prs;
}

function isNewPR(exerciseName,weight){
  if(!weight)return false;
  var w=parseFloat(weight);if(isNaN(w)||w<=0)return false;
  var prs=getAllPRs();
  return !prs[exerciseName]||w>prs[exerciseName].weight;
}

/* WEEKLY VOLUME: sets per week for last 4 weeks */
function getWeeklyVolume(){
  var sessions=getSessions();var now=new Date();var weeks=[];
  for(var i=3;i>=0;i--){
    var weekStart=new Date(now);weekStart.setDate(weekStart.getDate()-weekStart.getDay()-i*7);
    weekStart.setHours(0,0,0,0);
    var weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
    var sets=0;
    sessions.forEach(function(s){
      var d=new Date(s.date);
      if(d>=weekStart&&d<weekEnd){
        s.exercises.forEach(function(ex){sets+=ex.sets.filter(function(st){return st.completed&&!st.warmup;}).length;});
      }
    });
    var label;
    if(i===0)label='This wk';
    else if(i===1)label='Last wk';
    else label=i+'w ago';
    weeks.push({sets:sets,label:label,current:i===0});
  }
  return weeks;
}

/* STREAK (for Today tab) */
function getCurrentStreak(){
  var sessions=getSessions();if(!sessions.length)return 0;
  var dateSet={};
  sessions.forEach(function(s){
    var d=new Date(s.date);
    dateSet[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]=true;
  });
  var streak=0;var check=new Date();check.setHours(0,0,0,0);
  var todayStr=check.getFullYear()+'-'+String(check.getMonth()+1).padStart(2,'0')+'-'+String(check.getDate()).padStart(2,'0');
  if(!dateSet[todayStr])check.setDate(check.getDate()-1);
  while(true){
    var cs=check.getFullYear()+'-'+String(check.getMonth()+1).padStart(2,'0')+'-'+String(check.getDate()).padStart(2,'0');
    if(dateSet[cs]){streak++;check.setDate(check.getDate()-1);}else break;
  }
  return streak;
}

  if(bwLog.length>0){

    // Trend

    }

    var bwRange=bwMax-bwMin||1;

    });

function logBodyWeight(){

/* BEGIN SESSION: auto-fill weight from last session */
function beginSession(wid,version){
  var allW=getAllWorkouts();var w=allW.find(function(x){return x.id===wid;});if(!w)return;
  var template;if(version==='custom'&&w.exercises)template=w.exercises;else template=w[version]||w.short||w.optimal||[];
  var flags=getFlags();
  activeSession={workoutId:w.id,workoutName:w.name,version:version,startTime:new Date().toISOString(),
    exercises:template.map(function(ex){
      var flagKey=w.id+'::'+ex.name;var flag=flags[flagKey]||null;
      var prev=getPreviousExerciseData(ex.name,w.id);
      return{id:generateId(),name:ex.name,targetReps:ex.reps,targetSets:ex.sets||2,
        notes:'',flagUp:flag==='up',flagDown:flag==='down',prevFlag:flag,
        sets:Array.from({length:ex.sets||2},function(_,i){
          var ps=prev&&prev.sets&&prev.sets[i]?prev.sets[i]:null;
          return{weight:ps?ps.weight:'',reps:'',rir:i===0?1:0,failure:i===1,completed:false,_autofilled:!!ps};
        })};
    })};
  startSessionTimer();persistSession();resetIdleTimer();requestWakeLock();renderActiveSession();
  // Request notification permission for rest timer alerts
  if(Notification&&Notification.permission==='default'){Notification.requestPermission();}
}

/* REPEAT LAST WORKOUT: restart exactly what you did last time, weights pre-filled */
function repeatLastWorkout(){
  var sessions=getSessions();if(!sessions.length){showToast('No previous workout');return;}
  var last=sessions[sessions.length-1];
  var flags=getFlags();
  activeSession={workoutId:last.workoutId,workoutName:last.workoutName,version:last.version,startTime:new Date().toISOString(),
    exercises:last.exercises.map(function(ex){
      var flag=flags[last.workoutId+'::'+ex.name]||null;
      return{id:generateId(),name:ex.name,targetReps:(ex.sets[0]&&ex.sets[0].reps)?String(ex.sets[0].reps):'8-12',targetSets:ex.sets.length,notes:'',flagUp:flag==='up',flagDown:flag==='down',prevFlag:flag,
        sets:ex.sets.map(function(s,i){return{weight:s.weight||'',reps:'',rir:s.rir!=null?s.rir:(i===0?1:0),failure:!!s.failure,completed:false,warmup:!!s.warmup,_autofilled:!!s.weight};})};
    })};
  startSessionTimer();persistSession();resetIdleTimer();requestWakeLock();renderActiveSession();
  if(Notification&&Notification.permission==='default'){Notification.requestPermission();}
}

/* SET HANDLERS */
function updateSet(ei,si,f,v){
  if(!activeSession)return;
  if(f==='weight'||f==='reps'){
    var n=parseFloat(v);
    if(v!==''&&(isNaN(n)||n<0)){return;}
    v=v===''?'':n;
  }
  activeSession.exercises[ei].sets[si][f]=v;
  activeSession.exercises[ei].sets[si]._autofilled=false;
  persistSession();
}
function clearAutofill(el){el.classList.remove('autofilled');}
function toggleWarmup(ei,si){if(!activeSession)return;var s=activeSession.exercises[ei].sets[si];s.warmup=!s.warmup;persistSession();renderActiveSession();}
function getOverloadHint(name,wid){
  var prev=getPreviousExerciseData(name,wid);
  if(!prev||!prev.sets)return null;
  var best=null;
  prev.sets.forEach(function(s){
    if(!s.completed||s.warmup||!s.weight)return;
    var w=parseFloat(s.weight)||0,r=parseInt(s.reps)||0;
    if(w>0&&r>0&&(!best||w>best.w||(w===best.w&&r>best.r)))best={w:w,r:r};
  });
  if(!best)return null;
  var step=getUnits()==='kg'?2.5:5;
  return 'Last '+best.w+'×'+best.r+' — try '+best.w+'×'+(best.r+1)+' or '+(best.w+step)+'×'+best.r;
}
function cycleRIR(ei,si){if(!activeSession)return;activeSession.exercises[ei].sets[si].rir=(activeSession.exercises[ei].sets[si].rir+1)%5;persistSession();renderActiveSession();}
function toggleFailure(ei,si){if(!activeSession)return;var s=activeSession.exercises[ei].sets[si];s.failure=!s.failure;if(s.failure)s.rir=0;persistSession();renderActiveSession();}
function toggleComplete(ei,si){
  if(!activeSession)return;
  var ex=activeSession.exercises[ei];var s=ex.sets[si];
  s.completed=!s.completed;
  if(s.completed){
    // Auto-fill blanks from last session (Hevy-style quick logging)
    var prev=getPreviousExerciseData(ex.name,activeSession.workoutId);
    var prevSet=prev&&prev.sets&&prev.sets[si]?prev.sets[si]:null;
    if((s.weight===''||s.weight==null)&&prevSet&&prevSet.weight)s.weight=prevSet.weight;
    if((s.reps===''||s.reps==null)&&prevSet&&prevSet.reps)s.reps=prevSet.reps;
    s._autofilled=false;
    if(navigator.vibrate)navigator.vibrate(30);
    // Celebrate genuine PR (beating an existing record), not every first-ever set
    if(s.weight&&!s.warmup&&!s._celebrated){var _prs=getAllPRs();if(_prs[ex.name]&&parseFloat(s.weight)>_prs[ex.name].weight){s._celebrated=true;setTimeout(function(){showPRCelebration(ex.name);},150);}}
    startRestTimer();
  }
  persistSession();renderActiveSession();
}
function showPRCelebration(name){
  showToast('🏆 New PR — '+name+'!');
  var f=document.getElementById('screenFlash');
  if(f){f.style.background='#ffd60a';f.classList.remove('flashing');void f.offsetWidth;f.classList.add('flashing');setTimeout(function(){f.classList.remove('flashing');f.style.background='';},1500);}
  if(navigator.vibrate)navigator.vibrate([60,40,60,40,120]);
}
function addSet(ei){if(!activeSession)return;activeSession.exercises[ei].sets.push({weight:'',reps:'',rir:1,failure:false,completed:false,_autofilled:false});persistSession();renderActiveSession();}
function removeSet(ei){if(!activeSession)return;if(activeSession.exercises[ei].sets.length>1){activeSession.exercises[ei].sets.pop();persistSession();renderActiveSession();}}
function toggleFlag(ei,dir){if(!activeSession)return;var ex=activeSession.exercises[ei];if(dir==='up'){ex.flagUp=!ex.flagUp;if(ex.flagUp)ex.flagDown=false;}else{ex.flagDown=!ex.flagDown;if(ex.flagDown)ex.flagUp=false;}persistSession();renderActiveSession();}
function toggleNotes(ei){if(!activeSession)return;activeSession.exercises[ei].showNotes=!activeSession.exercises[ei].showNotes;var a=document.getElementById('notes-area-'+ei);if(a)a.classList.toggle('visible');}
function updateNotes(ei,v){if(!activeSession)return;activeSession.exercises[ei].notes=v;persistSession();}
function moveExercise(ei,dir){if(!activeSession)return;var ni=ei+dir;if(ni<0||ni>=activeSession.exercises.length)return;var a=activeSession.exercises;var tmp=a[ei];a[ei]=a[ni];a[ni]=tmp;persistSession();renderActiveSession();}
function deleteExercise(ei){

  var name=activeSession.exercises[ei].name;

/* PLATE CALCULATOR */
function getBarWeight(){var v=parseFloat(localStorage.getItem(NS+'bar_weight'));if(!isNaN(v)&&v>0)return v;return getUnits()==='kg'?20:45;}
function setBarWeight(w){localStorage.setItem(NS+'bar_weight',w);}
var PLATE_COLORS={'45':'#0a84ff','35':'#ffd60a','25':'#30d158','20':'#0a84ff','15':'#ffd60a','10':'#f5f5f7','5':'#ff453a','2.5':'#ff375f','1.25':'#98989d'};
function computePlates(total){
  var bar=getBarWeight();
  var plates=getUnits()==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];
  var perSide=(total-bar)/2;
  if(perSide<=0)return{ok:false,bar:bar,perSide:perSide};
  var result=[];var rem=perSide;
  plates.forEach(function(p){while(rem>=p-1e-9){result.push(p);rem=Math.round((rem-p)*100)/100;}});
  return{ok:true,bar:bar,perSide:perSide,plates:result,leftover:rem};
}
function showPlateCalc(seed){
  openModal('<div class="modal-title">Plate Calculator</div>'+
    '<div style="display:flex;gap:10px;margin-bottom:12px"><div style="flex:2"><label class="label">Total weight ('+wtLabel()+')</label><input type="number" id="plateWeight" value="'+(seed||'')+'" inputmode="decimal" oninput="renderPlateResult()"></div><div style="flex:1"><label class="label">Bar</label><input type="number" id="plateBar" value="'+getBarWeight()+'" inputmode="decimal" oninput="setBarWeight(parseFloat(this.value)||0);renderPlateResult()"></div></div>'+
    '<div id="plateResult"></div>');
  setTimeout(renderPlateResult,50);
}
function renderPlateResult(){
  var c=document.getElementById('plateResult');if(!c)return;
  var w=parseFloat((document.getElementById('plateWeight')||{}).value);
  if(isNaN(w)||w<=0){c.innerHTML='<div style="text-align:center;color:var(--text-tertiary);padding:20px">Enter a weight</div>';return;}
  var r=computePlates(w);
  if(!r.ok){c.innerHTML='<div style="text-align:center;color:var(--text-secondary);padding:20px">Weight is at or below the bar ('+r.bar+' '+wtLabel()+')</div>';return;}
  var html='<div class="plate-vis">';
  if(r.plates.length===0){html+='<span style="color:var(--text-tertiary)">Just the bar</span>';}
  r.plates.forEach(function(p){var col=PLATE_COLORS[String(p)]||'#636366';var dark=(String(p)==='10');html+='<div class="plate-chip" style="background:'+col+';color:'+(dark?'#000':'#fff')+'">'+p+'</div>';});
  html+='</div>';
  html+='<div style="text-align:center;font-size:14px;color:var(--text-secondary);margin-bottom:4px">Per side: <strong style="color:var(--text-primary)">'+(r.plates.length?r.plates.join(' + '):'—')+'</strong></div>';
  html+='<div style="text-align:center;font-size:13px;color:var(--text-tertiary)">'+r.bar+' bar + 2 × '+r.perSide+' '+wtLabel()+(r.leftover>0.01?' &middot; '+r.leftover+' '+wtLabel()+' unmatched':'')+'</div>';
  c.innerHTML=html;
}

/* EXERCISE PROGRESS / HISTORY CHART */
function getExerciseHistory(name){
  var sessions=getSessions();var pts=[];
  sessions.forEach(function(s){
    var ex=s.exercises.find(function(e){return e.name===name;});
    if(!ex)return;
    var bestW=0,bestRm=0,vol=0;
    ex.sets.forEach(function(set){
      if(!set.completed||set.warmup)return;var w=parseFloat(set.weight)||0,rp=parseInt(set.reps)||0;if(w<=0)return;
      vol+=w*rp;if(w>bestW)bestW=w;var rm=calc1RM(set.weight,set.reps)||0;if(rm>bestRm)bestRm=rm;
    });
    if(bestW>0)pts.push({date:s.date,bestW:bestW,bestRm:bestRm,vol:vol});
  });
  return pts;
}
function showExerciseProgress(name){
  if(!name){showToast('No data yet');return;}
  var pts=getExerciseHistory(name);
  var html='<div class="modal-title">'+escapeHtml(name)+'</div>';
  if(pts.length===0){html+='<div class="empty-state"><div class="empty-icon">📈</div><p>No completed sets logged yet.<br>Finish a set to start tracking progress.</p></div><button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button>';openModal(html);return;}
  var allRm=pts.map(function(p){return p.bestRm;});
  var allW=pts.map(function(p){return p.bestW;});
  var bestEverRm=Math.max.apply(null,allRm);
  var bestEverW=Math.max.apply(null,allW);
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">';
  html+='<div class="stat-card"><div class="stat-num accent" style="font-size:20px">'+bestEverRm+'</div><div class="stat-label">Best e1RM</div></div>';
  html+='<div class="stat-card"><div class="stat-num green" style="font-size:20px">'+bestEverW+'</div><div class="stat-label">Top Weight</div></div>';
  html+='<div class="stat-card"><div class="stat-num orange" style="font-size:20px">'+pts.length+'</div><div class="stat-label">Sessions</div></div>';
  html+='</div>';
  // e1RM trend chart (last 12)
  var recent=pts.slice(-12);
  var maxRm=Math.max.apply(null,recent.map(function(p){return p.bestRm;}))||1;
  html+='<div class="volume-chart"><div class="volume-chart-title">Estimated 1RM Trend</div><div class="vol-bars">';
  recent.forEach(function(p,i){
    var h=Math.round((p.bestRm/maxRm)*80);
    html+='<div class="vol-bar-col"><div class="vol-bar-val">'+p.bestRm+'</div><div class="vol-bar '+(i===recent.length-1?'current':'')+'" style="height:'+Math.max(h,2)+'px"></div><div class="vol-bar-label">'+new Date(p.date).toLocaleDateString('en-US',{month:'numeric',day:'numeric'})+'</div></div>';
  });
  html+='</div></div>';
  html+='<button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button>';
  openModal(html);
}

/* SAVE / DISCARD */
function saveSession(){
  if(!activeSession)return;stopSessionTimer();var flags=getFlags();
  activeSession.exercises.forEach(function(ex){var k=activeSession.workoutId+'::'+ex.name;if(ex.flagUp)flags[k]='up';else if(ex.flagDown)flags[k]='down';else delete flags[k];});
  saveFlags(flags);
  var session={id:generateId(),workoutId:activeSession.workoutId,workoutName:activeSession.workoutName,version:activeSession.version,date:new Date().toISOString(),startTime:activeSession.startTime,
    exercises:activeSession.exercises.map(function(ex){return{name:ex.name,notes:ex.notes||'',flagUp:ex.flagUp,flagDown:ex.flagDown,sets:ex.sets.map(function(s){return{weight:s.weight,reps:s.reps,rir:s.rir,failure:s.failure,completed:s.completed,warmup:!!s.warmup};})};})};
  // Capture PRs from PRIOR history (before adding this session) so we detect genuinely new records
  var _priorPRs=getAllPRs();
  var sessions=getSessions();sessions.push(session);saveSessions(sessions);setLastWorkout(activeSession.workoutId);
  // Compute summary stats before clearing (working sets only — exclude warmups)
  var _dur=Math.floor((new Date(session.date).getTime()-new Date(session.startTime).getTime())/1000);
  var _durStr=_dur>0?(Math.floor(_dur/3600)>0?Math.floor(_dur/3600)+'h ':'')+(Math.floor((_dur%3600)/60))+'m':'';
  var _vol=0;var _sets=0;var _newPRs={};
  session.exercises.forEach(function(ex){ex.sets.forEach(function(s){if(s.completed){_sets++;if(s.warmup)return;var w=parseFloat(s.weight)||0,r=parseInt(s.reps)||0;_vol+=w*r;if(w>0&&(!_priorPRs[ex.name]||w>_priorPRs[ex.name].weight))_newPRs[ex.name]=1;}});});
  var _newPRsArr=Object.keys(_newPRs);
  activeSession=null;clearPersistedSession();cancelIdleTimer();releaseWakeLock();dismissKeyboard();if(navigator.vibrate)navigator.vibrate([50,30,50]);
  sbPush();
  renderToday();$('#pageTitle').textContent='Today';$('#headerActions').innerHTML='';
  // Show summary modal
  var _sumHtml='<div class="modal-title">Workout Complete 💪</div>';
  _sumHtml+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
  _sumHtml+='<div class="stat-card"><div class="stat-num green">'+_sets+'</div><div class="stat-label">Sets Done</div></div>';
  if(_durStr)_sumHtml+='<div class="stat-card"><div class="stat-num accent">'+_durStr+'</div><div class="stat-label">Duration</div></div>';
  if(_vol>0)_sumHtml+='<div class="stat-card"><div class="stat-num orange">'+(_vol>999?(_vol/1000).toFixed(1)+'k':_vol)+'</div><div class="stat-label">Volume ('+wtLabel()+')</div></div>';
  _sumHtml+='<div class="stat-card"><div class="stat-num" style="color:var(--text-primary)">'+session.exercises.length+'</div><div class="stat-label">Exercises</div></div>';
  _sumHtml+='</div>';
  if(_newPRsArr.length>0){_sumHtml+='<div style="background:rgba(255,214,10,0.1);border:0.5px solid rgba(255,214,10,0.3);border-radius:var(--radius-md);padding:12px;margin-bottom:16px"><div style="font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:6px">★ New Personal Records</div>';_newPRsArr.forEach(function(n){_sumHtml+='<div style="font-size:13px;color:var(--text-secondary);padding:2px 0">'+escapeHtml(n)+'</div>';});_sumHtml+='</div>';}
  _sumHtml+='<button class="btn btn-green btn-block" onclick="closeModal()">Done</button>';
  openModal(_sumHtml);
}
function discardSession(){showConfirm('Discard Session?','All progress will be lost.',function(){stopSessionTimer();cancelIdleTimer();releaseWakeLock();dismissKeyboard();activeSession=null;clearPersistedSession();renderToday();$('#pageTitle').textContent='Today';$('#headerActions').innerHTML='';showToast('Session discarded');},'Discard',true);}

function renderHistory(){

function filterHistory(){
  var sessions=getSessions();var search=(document.getElementById('histSearch')?document.getElementById('histSearch').value:'').toLowerCase();
  var filter=document.getElementById('histFilter')?document.getElementById('histFilter').value:'';
  var filtered=sessions.slice().reverse();
  if(filter)filtered=filtered.filter(function(s){return s.workoutName===filter;});
  if(search)filtered=filtered.filter(function(s){return s.exercises.some(function(e){return e.name.toLowerCase().indexOf(search)!==-1;});});
  var container=document.getElementById('historyList');if(!container)return;
  if(!filtered.length){container.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><p>No sessions found</p></div>';return;}

  var prs=getAllPRs();
  var html='';
  filtered.forEach(function(s){
    // Compute session stats
    var totalSets=0,completedSets=0,totalVolume=0;
    s.exercises.forEach(function(ex){
      ex.sets.forEach(function(set){
        totalSets++;
        if(set.completed){completedSets++;if(!set.warmup){var w=parseFloat(set.weight)||0;var r=parseInt(set.reps)||0;totalVolume+=w*r;}}
      });
    });
    var duration='';
    if(s.startTime){var diff=Math.floor((new Date(s.date).getTime()-new Date(s.startTime).getTime())/1000);if(diff>0){var dm=Math.floor(diff/60);duration=dm+'m';}}

    html+='<div class="history-session" id="hist-'+s.id+'">';
    html+='<div class="history-session-header" onclick="toggleHistSession(\''+s.id+'\')">';
    html+='<div class="hs-left">';
    html+='<div class="hs-name">'+escapeHtml(s.workoutName)+' <span class="badge badge-blue">'+escapeHtml(s.version)+'</span></div>';
    html+='<div class="hs-date">'+formatDate(s.date)+' at '+formatTime(s.date)+'</div>';
    html+='<div class="hs-summary">';
    html+='<div class="hs-summary-item"><strong>'+completedSets+'</strong>/'+totalSets+' sets</div>';
    if(totalVolume>0)html+='<div class="hs-summary-item"><strong>'+totalVolume.toLocaleString()+'</strong> '+wtLabel()+' vol</div>';
    html+='<div class="hs-summary-item"><strong>'+s.exercises.length+'</strong> exercises</div>';
    if(duration)html+='<div class="hs-summary-item"><strong>'+duration+'</strong></div>';
    html+='</div>';
    html+='</div>';
    html+='<div class="hs-chevron">›</div>';
    html+='</div>';

    html+='<div class="history-session-body">';
    s.exercises.forEach(function(ex){
      // Per-exercise volume
      var exVol=0;ex.sets.forEach(function(set){if(set.completed&&!set.warmup){exVol+=(parseFloat(set.weight)||0)*(parseInt(set.reps)||0);}});
      // Check if any set was a PR
      var bestWeight=0;ex.sets.forEach(function(set){if(set.completed&&set.weight){var w=parseFloat(set.weight);if(w>bestWeight)bestWeight=w;}});
      var isPR=bestWeight>0&&prs[ex.name]&&bestWeight>=prs[ex.name].weight;

      html+='<div class="hist-exercise">';
      html+='<div class="hist-ex-header"><div class="hist-ex-name hist-ex-tap" data-ex-progress="'+escapeHtml(ex.name)+'">';
      if(ex.flagUp)html+='<span class="flag-arrow flag-up">▲</span>';
      if(ex.flagDown)html+='<span class="flag-arrow flag-down">▼</span>';
      html+=escapeHtml(ex.name);
      if(isPR)html+='<span class="pr-badge">★ PR</span>';
      html+='<span style="font-size:11px;color:var(--text-tertiary);margin-left:4px">📈</span>';
      html+='</div>';
      if(exVol>0)html+='<div class="hist-ex-vol">'+exVol.toLocaleString()+' '+wtLabel()+'</div>';
      html+='</div>';

      // Set grid

    html+='<div style="display:grid;grid-template-columns:24px 1fr 1fr 44px 28px;gap:6px;font-size:10px;color:var(--text-tertiary);text-transform:uppercase;margin-bottom:4px"><div></div><div>Weight</div><div>Reps</div><div>RIR</div><div>✓</div></div>';

      html+='<input type="number" class="set-input" value="'+(st.weight!=null?st.weight:'')+'" placeholder="'+wtLabel()+'" inputmode="decimal" oninput="histEditSet('+ei+','+si+',\'weight\',this.value)">';
      html+='<input type="number" class="set-input" value="'+(st.reps!=null?st.reps:'')+'" placeholder="reps" inputmode="numeric" oninput="histEditSet('+ei+','+si+',\'reps\',this.value)">';
      html+='<button class="rir-btn rir-'+Math.min(st.rir||0,4)+'" onclick="histEditRir('+ei+','+si+')">'+((st.rir>=4)?'4+':(st.rir||0))+'</button>';
      html+='<button class="done-check '+(st.completed?'checked':'')+'" onclick="histEditToggle('+ei+','+si+')">'+(st.completed?'✓':'')+'</button>';

  openModal(html);
}
function histEditSet(ei,si,f,v){if(!_histEdit)return;if(f==='weight'||f==='reps'){var n=parseFloat(v);if(v!==''&&(isNaN(n)||n<0))return;v=(v===''?'':n);}_histEdit.exercises[ei].sets[si][f]=v;}
function histEditRir(ei,si){if(!_histEdit)return;var st=_histEdit.exercises[ei].sets[si];st.rir=((st.rir||0)+1)%5;renderHistEditor();}
function histEditToggle(ei,si){if(!_histEdit)return;var st=_histEdit.exercises[ei].sets[si];st.completed=!st.completed;renderHistEditor();}
function saveHistEdit(){
  if(!_histEdit)return;
  var sessions=getSessions();var idx=-1;for(var i=0;i<sessions.length;i++){if(sessions[i].id===_histEdit.id){idx=i;break;}}
  if(idx>=0){sessions[idx]=_histEdit;saveSessions(sessions);if(typeof sbAutoSync==='function')sbAutoSync();}
  _histEdit=null;closeModal();renderHistory();showToast('Session updated');
}
function deleteSession(id){showConfirm('Delete Session?','This cannot be undone.',function(){saveSessions(getSessions().filter(function(s){return s.id!==id;}));renderHistory();showToast('Session deleted');},'Delete',true);}

/* WORKOUTS TAB: multi-delete + editable defaults */

  html+='<div class="section-header">Workouts</div>';
  allW.forEach(function(w,i){

    html+='<div class="workout-list-item '+(sel?'selected':'')+'" onclick="'+(workoutSelectMode?'toggleWorkoutSelect(\''+w.id+'\')':'previewWorkout(\''+w.id+'\')')+'">';
    if(workoutSelectMode)html+='<button class="wli-checkbox '+(sel?'checked':'')+'" onclick="event.stopPropagation();toggleWorkoutSelect(\''+w.id+'\')">'+(sel?'✓':'')+'</button>';
    html+='<div class="wli-left"><div class="wli-name">'+w.name+(w.isDefault?' <span class="badge badge-blue" style="font-size:9px">DEFAULT</span>':'')+'</div><div class="wli-detail">'+detail+'</div></div>';
    if(!workoutSelectMode)html+='<div class="wli-actions"><div class="wli-reorder"><button class="wli-reorder-btn" onclick="event.stopPropagation();moveWorkout(\''+w.id+'\',-1)" '+(i===0?'disabled':'')+'>▲</button><button class="wli-reorder-btn" onclick="event.stopPropagation();moveWorkout(\''+w.id+'\',1)" '+(i===allW.length-1?'disabled':'')+'>▼</button></div><button class="ex-icon-btn" onclick="event.stopPropagation();editWorkout(\''+w.id+'\')" title="Edit">✎</button><button class="ex-icon-btn" onclick="event.stopPropagation();duplicateWorkout(\''+w.id+'\')" title="Duplicate">⧉</button></div>';
    html+='</div>';
  });

  html+='<div style="padding:16px 0;display:flex;gap:10px"><button class="btn btn-primary btn-block" onclick="openWorkoutBuilder()" style="flex:2">+ Create Workout</button><button class="btn btn-secondary btn-block" onclick="enterSelectMode()" style="flex:1">'+(workoutSelectMode?'Done':'Select')+'</button></div>';

}
function enterSelectMode(){workoutSelectMode=!workoutSelectMode;workoutSelected.clear();renderWorkouts();}
function cancelSelectMode(){workoutSelectMode=false;workoutSelected.clear();renderWorkouts();}
function toggleWorkoutSelect(id){if(workoutSelected.has(id))workoutSelected.delete(id);else workoutSelected.add(id);renderWorkouts();}
function moveWorkout(id,direction){
  var allW=getAllWorkouts();
  var order=allW.map(function(w){return w.id;});
  var idx=-1;for(var i=0;i<order.length;i++){if(order[i]===id){idx=i;break;}}
  if(idx===-1)return;
  var newIdx=idx+direction;
  if(newIdx<0||newIdx>=order.length)return;
  var tmp=order[idx];order[idx]=order[newIdx];order[newIdx]=tmp;
  saveWorkoutOrder(order);renderWorkouts();
}
function deleteSelectedWorkouts(){
  var count=workoutSelected.size;
  showConfirm('Delete '+count+' workout'+(count>1?'s':'')+'?','This cannot be undone.',function(){
    var deleted=getDeletedDefaults();var customs=getCustomWorkouts();var edited=getEditedDefaults();
    workoutSelected.forEach(function(id){if(DEFAULT_WORKOUTS.find(function(w){return w.id===id;})){if(deleted.indexOf(id)===-1)deleted.push(id);delete edited[id];}else{customs=customs.filter(function(w){return w.id!==id;});}});
    saveDeletedDefaults(deleted);saveEditedDefaults(edited);saveCustomWorkouts(customs);
    workoutSelectMode=false;workoutSelected.clear();renderWorkouts();showToast(count+' workout'+(count>1?'s':'')+' deleted');
  },'Delete',true);
}

function previewWorkout(id){
  var allW=getAllWorkouts();var w=allW.find(function(x){return x.id===id;});if(!w)return;
  var html='<div class="modal-title">'+w.name+'</div>';
  if(w.subtitle)html+='<p style="text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:16px">'+w.subtitle+'</p>';
  if(w.short){html+='<div class="section-header">Short Version</div>';w.short.forEach(function(ex){html+='<div style="padding:6px 0;font-size:14px">'+ex.name+' <span style="color:var(--text-secondary)">'+ex.sets+' × '+ex.reps+'</span></div>';});}

/* WORKOUT BUILDER */
var builderState=null;
function editWorkout(id){var allW=getAllWorkouts();var w=allW.find(function(x){return x.id===id;});if(!w)return;builderState=JSON.parse(JSON.stringify(w));builderState._editing=true;builderState._isDefault=!!w.isDefault;if(w.short&&w.short.length>0)builderState.hasVersions=true;renderBuilder();}
function openWorkoutBuilder(editId){
  if(editId){editWorkout(editId);return;}
  builderState={id:'custom_'+generateId(),name:'',subtitle:'',isDefault:false,hasVersions:false,short:[],optimal:[],exercises:[{name:'',sets:2,reps:'8-12'}],_editing:false,_isDefault:false};renderBuilder();
}
function renderBuilder(){
  var bs=builderState;var isV=bs.hasVersions||(bs.short&&bs.short.length>0&&bs._editing);
  var html='<div class="modal-title">'+(bs._editing?'Edit':'Create')+' Workout</div>';
  html+='<div style="margin-bottom:12px"><label class="label">Workout Name</label><input type="text" id="builderName" value="'+bs.name+'" placeholder="e.g. Push Day" onchange="builderState.name=this.value"></div>';
  html+='<div style="margin-bottom:12px"><label class="label">Subtitle (optional)</label><input type="text" id="builderSub" value="'+(bs.subtitle||'')+'" placeholder="e.g. Chest & Triceps" onchange="builderState.subtitle=this.value"></div>';
  html+='<div class="toggle-row" style="border-bottom:none;margin-bottom:12px"><span class="toggle-label">Short & Optimal versions</span><button class="toggle-switch '+(isV?'on':'')+'" onclick="toggleBuilderVersions()"></button></div>';
  if(isV){
    html+='<div class="section-header">Short Version</div>'+renderBuilderExercises(bs.short||[],'short')+'<button class="btn btn-secondary btn-sm" onclick="addBuilderExercise(\'short\')" style="margin-bottom:16px">+ Add Exercise</button>';
    html+='<div class="section-header">Optimal Version</div>'+renderBuilderExercises(bs.optimal||[],'optimal')+'<button class="btn btn-secondary btn-sm" onclick="addBuilderExercise(\'optimal\')" style="margin-bottom:16px">+ Add Exercise</button>';
  }else{
    html+='<div class="section-header">Exercises</div>'+renderBuilderExercises(bs.exercises||[],'exercises')+'<button class="btn btn-secondary btn-sm" onclick="addBuilderExercise(\'exercises\')" style="margin-bottom:16px">+ Add Exercise</button>';
  }
  html+='<div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-secondary btn-block" onclick="closeModal()">Cancel</button><button class="btn btn-primary btn-block" onclick="saveBuilder()">Save</button></div>';
  openModal(html);
}
function renderBuilderExercises(exs,key){var html='';exs.forEach(function(ex,i){html+='<div class="builder-exercise"><button class="be-remove" onclick="removeBuilderExercise(\''+key+'\','+i+')">✕</button><div class="be-reorder"><button class="be-reorder-btn" onclick="moveBuilderExercise(\''+key+'\','+i+',-1)" '+(i===0?'disabled':'')+'>▲</button><button class="be-reorder-btn" onclick="moveBuilderExercise(\''+key+'\','+i+',1)" '+(i===exs.length-1?'disabled':'')+'>▼</button></div><div class="be-row"><input type="text" value="'+ex.name+'" placeholder="Exercise name" onchange="updateBuilderExercise(\''+key+'\','+i+',\'name\',this.value)" style="flex:1"></div><div class="be-row"><div style="flex:1"><label class="label">Sets</label><input type="number" value="'+ex.sets+'" min="1" max="10" onchange="updateBuilderExercise(\''+key+'\','+i+',\'sets\',parseInt(this.value))"></div><div style="flex:1"><label class="label">Reps</label><input type="text" value="'+ex.reps+'" placeholder="8-12" onchange="updateBuilderExercise(\''+key+'\','+i+',\'reps\',this.value)"></div></div></div>';});return html;}
function toggleBuilderVersions(){
  builderState.hasVersions=!builderState.hasVersions;
  if(builderState.hasVersions){if(!builderState.short||!builderState.short.length)builderState.short=builderState.exercises?builderState.exercises.slice():[{name:'',sets:2,reps:'8-12'}];if(!builderState.optimal||!builderState.optimal.length)builderState.optimal=builderState.exercises?builderState.exercises.slice():[{name:'',sets:2,reps:'8-12'}];}
  else{builderState.exercises=builderState.short&&builderState.short.length>0?builderState.short.slice():[{name:'',sets:2,reps:'8-12'}];}
  renderBuilder();
}
function addBuilderExercise(k){if(!builderState[k])builderState[k]=[];builderState[k].push({name:'',sets:2,reps:'8-12'});renderBuilder();}
function removeBuilderExercise(k,i){builderState[k].splice(i,1);renderBuilder();}
function moveBuilderExercise(k,i,dir){var arr=builderState[k];if(!arr)return;var ni=i+dir;if(ni<0||ni>=arr.length)return;var tmp=arr[i];arr[i]=arr[ni];arr[ni]=tmp;renderBuilder();}
function updateBuilderExercise(k,i,f,v){builderState[k][i][f]=v;}
function saveBuilder(){
  if(!builderState.name.trim()){showToast('Please enter a workout name');return;}
  var w={id:builderState.id,name:builderState.name.trim(),subtitle:builderState.subtitle||''};
  if(builderState.hasVersions){w.short=(builderState.short||[]).filter(function(e){return e.name.trim();});w.optimal=(builderState.optimal||[]).filter(function(e){return e.name.trim();});}
  else{w.exercises=(builderState.exercises||[]).filter(function(e){return e.name.trim();});}
  if(builderState._isDefault){var edited=getEditedDefaults();edited[builderState.id]=w;saveEditedDefaults(edited);}
  else{w.isDefault=false;var customs=getCustomWorkouts();var idx=-1;for(var ci=0;ci<customs.length;ci++){if(customs[ci].id===w.id){idx=ci;break;}}if(idx>=0)customs[idx]=w;else customs.push(w);saveCustomWorkouts(customs);}
  closeModal();renderWorkouts();showToast(builderState._editing?'Workout updated':'Workout created');builderState=null;
}
function duplicateWorkout(id){var allW=getAllWorkouts();var o=allW.find(function(w){return w.id===id;});if(!o)return;var c=JSON.parse(JSON.stringify(o));c.id='custom_'+generateId();c.name+=' (Copy)';c.isDefault=false;var customs=getCustomWorkouts();customs.push(c);saveCustomWorkouts(customs);renderWorkouts();showToast('Workout duplicated');}

/* SUPABASE UI HANDLERS */
function _sbSchemaErr(err){var m=((err&&err.message)||'').toString();return /PGRST202|find the function|does not exist|schema cache|relation|404/i.test(m);}
function doSbLogin(){
  var u=(document.getElementById('sbUsernameInput')||{}).value||'';
  var p=(document.getElementById('sbPasswordInput')||{}).value||'';
  if(!u.trim()||!p){showToast('Enter username and password');return;}
  showToast('Signing in...');
  sbLogin(u.trim(),p).then(function(){
    showToast('Welcome back, '+sbUser.username+'!');
    sbPull().then(function(data){
      if(data){var merged=mergeAllData(getAllDataForSync(),data);restoreAllData(merged);if(!activeSession)restoreSession();}
      sbPush();renderSettings();if(currentTab==='today')renderToday();if(currentTab==='history')renderHistory();
    });
  }).catch(function(err){showToast(_sbSchemaErr(err)?'Cloud not set up — run the setup SQL in Supabase':'Error: '+(err.message||'Invalid credentials'));});
}
function doSbRegister(){
  var u=(document.getElementById('sbUsernameInput')||{}).value||'';
  var p=(document.getElementById('sbPasswordInput')||{}).value||'';
  if(!u.trim()||!p){showToast('Enter a username and password');return;}
  if(u.trim().length<3){showToast('Username must be at least 3 characters');return;}
  if(p.length<4){showToast('Password must be at least 4 characters');return;}
  showToast('Creating account...');
  sbRegister(u.trim(),p).then(function(){
    showToast('Account created! Welcome, '+sbUser.username+'!');
    sbPush();renderSettings();
  }).catch(function(err){
    var msg=err.message||'';
    showToast(_sbSchemaErr(err)?'Cloud not set up — run the setup SQL in Supabase':(msg.includes('username_taken')?'Username already taken':('Error: '+msg)));
  });
}
function doSbLogout(){showConfirm('Sign Out?','Your cloud data stays safe. Sign back in anytime to restore.',function(){sbLogout();showToast('Signed out');renderSettings();});}
function doSbPush(){showToast('Syncing...');sbPush().then(function(ok){showToast(ok?'Synced to cloud!':'Sync failed — check connection');});}
function doSbPull(){showConfirm('Restore from Cloud?','This will replace all local data with your cloud backup.',function(){sbPull().then(function(data){if(data){restoreAllData(data);restoreSession();showToast('Restored!');switchTab('today');}else{showToast('No cloud data found');}});});}
function resetDefaults(){showConfirm('Reset Default Workouts?','This restores all 4 defaults to their original state and resets workout order.',function(){saveDeletedDefaults([]);saveEditedDefaults({});saveWorkoutOrder([]);renderSettings();showToast('Defaults restored');});}
function openRestTimerSetting(){var c=getRestDuration();openModal('<div class="modal-title">Rest Timer</div><p style="text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:20px">Default rest duration between sets</p><div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px"><button class="btn btn-secondary" onclick="adjustRestSetting(-15)">-15s</button><div style="font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;width:80px;text-align:center" id="restSettingDisplay">'+c+'s</div><button class="btn btn-secondary" onclick="adjustRestSetting(15)">+15s</button></div><input type="range" id="restSettingSlider" min="30" max="300" step="15" value="'+c+'" oninput="updateRestSettingFromSlider(this.value)" style="width:100%;margin-bottom:20px;accent-color:var(--accent)"><button class="btn btn-primary btn-block" onclick="saveRestSetting()">Save</button><button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="playAlarm();flashScreen()">🔔 Test Alarm + Flash</button><p style="text-align:center;font-size:12px;color:var(--text-tertiary);margin-top:10px">Sound plays through iPhone speaker when rest ends. Keep the app open.</p>');}
function adjustRestSetting(d){var s=document.getElementById('restSettingSlider'),di=document.getElementById('restSettingDisplay');var v=parseInt(s.value)+d;v=Math.max(30,Math.min(300,v));s.value=v;di.textContent=v+'s';}
function updateRestSettingFromSlider(v){document.getElementById('restSettingDisplay').textContent=v+'s';}
function saveRestSetting(){setRestDuration(parseInt(document.getElementById('restSettingSlider').value));closeModal();renderSettings();showToast('Rest timer updated');}
function exportData(){
  var data={sessions:getSessions(),customWorkouts:getCustomWorkouts(),flags:getFlags(),restDuration:getRestDuration(),lastWorkout:getLastWorkout(),deletedDefaults:getDeletedDefaults(),editedDefaults:getEditedDefaults(),bodyWeight:getBodyWeightLog(),workoutOrder:getWorkoutOrder(),exportDate:new Date().toISOString(),version:'2.0'};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ulul-backup-'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(url);showToast('Data exported');
}
function importData(event){
  var file=event.target.files[0];if(!file)return;var reader=new FileReader();
  reader.onload=function(e){try{var data=JSON.parse(e.target.result);showConfirm('Import Data?','This replaces all current data.',function(){if(data.sessions)saveSessions(data.sessions);if(data.customWorkouts)saveCustomWorkouts(data.customWorkouts);if(data.flags)saveFlags(data.flags);if(data.restDuration)setRestDuration(data.restDuration);if(data.lastWorkout)setLastWorkout(data.lastWorkout);if(data.deletedDefaults)saveDeletedDefaults(data.deletedDefaults);if(data.editedDefaults)saveEditedDefaults(data.editedDefaults);if(data.bodyWeight)saveBodyWeightLog(data.bodyWeight);if(data.workoutOrder)saveWorkoutOrder(data.workoutOrder);showToast('Data imported');renderSettings();});}catch(err){showToast('Invalid file format');}};
  reader.readAsText(file);event.target.value='';
}
function clearAllData(){showConfirm('Clear All Data?','This permanently deletes everything.',function(){Object.keys(KEYS).forEach(function(k){localStorage.removeItem(KEYS[k]);});activeSession=null;clearPersistedSession();stopSessionTimer();showToast('All data cleared');switchTab('today');},'Clear Everything',true);}

/* CALENDAR TAB */
var calYear=new Date().getFullYear();
var calMonth=new Date().getMonth();
var calSelectedDate=null;

function renderCalendar(){
  var container=$('#tab-calendar');
  var sessions=getSessions();
  var now=new Date();
  var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  // Build session map: dateStr -> [sessions]
  var sessionMap={};
  sessions.forEach(function(s){
    var d=new Date(s.date);
    var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!sessionMap[key])sessionMap[key]=[];
    sessionMap[key].push(s);
  });

  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var firstDay=new Date(calYear,calMonth,1).getDay();
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();

  // Streak calculation
  var streak=0;
  var checkDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  // If no session today, start checking from yesterday
  var checkStr=checkDate.getFullYear()+'-'+String(checkDate.getMonth()+1).padStart(2,'0')+'-'+String(checkDate.getDate()).padStart(2,'0');
  if(!sessionMap[checkStr]){checkDate.setDate(checkDate.getDate()-1);}
  while(true){
    var cs=checkDate.getFullYear()+'-'+String(checkDate.getMonth()+1).padStart(2,'0')+'-'+String(checkDate.getDate()).padStart(2,'0');
    if(sessionMap[cs]){streak++;checkDate.setDate(checkDate.getDate()-1);}else{break;}
  }

  // Sessions this month count
  var monthSessions=0;
  for(var key in sessionMap){
    var parts=key.split('-');
    if(parseInt(parts[0])===calYear&&parseInt(parts[1])===calMonth+1)monthSessions+=sessionMap[key].length;
  }

  var html='';

  // Streak bar
  html+='<div class="cal-streak"><div class="cal-streak-num">'+streak+'</div><div><div class="cal-streak-label">Day Streak</div><div class="cal-streak-sub">'+monthSessions+' session'+(monthSessions!==1?'s':'')+' in '+monthNames[calMonth]+'</div></div></div>';

  // Nav
  html+='<div class="cal-nav"><button class="cal-nav-btn" onclick="calPrev()">‹</button><div class="cal-nav-title">'+monthNames[calMonth]+' '+calYear+'</div><button class="cal-nav-btn" onclick="calNext()">›</button></div>';

  // Grid
  html+='<div class="cal-grid">';
  var dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dows.forEach(function(d){html+='<div class="cal-dow">'+d+'</div>';});

  // Empty cells before first day
  for(var e=0;e<firstDay;e++){html+='<div class="cal-day empty"></div>';}

  // Day cells
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=dateStr===todayStr;
    var isSelected=dateStr===calSelectedDate;
    var hasSession=!!sessionMap[dateStr];
    var classes='cal-day';
    if(isToday)classes+=' today';
    if(isSelected)classes+=' selected';
    html+='<div class="'+classes+'" onclick="calSelectDay(\''+dateStr+'\')">';
    html+=d;
    if(hasSession)html+='<div class="cal-dot"></div>';
    html+='</div>';
  }
  html+='</div>';

  // Selected day detail
  if(calSelectedDate&&sessionMap[calSelectedDate]){
    var daySessions=sessionMap[calSelectedDate];
    daySessions.forEach(function(s){
      html+='<div class="cal-day-detail">';
      html+='<div class="cal-detail-header">'+escapeHtml(s.workoutName)+' <span class="badge badge-blue">'+escapeHtml(s.version)+'</span></div>';
      html+='<div class="cal-detail-sub">'+formatTime(s.date)+(s.startTime?' &middot; Started '+formatTime(s.startTime):'')+'</div>';
      s.exercises.forEach(function(ex){
        html+='<div class="cal-detail-ex-name">'+escapeHtml(ex.name)+'</div>';
        ex.sets.forEach(function(set,i){
          var rl=set.rir>=4?'4+':set.rir;
          html+='<div class="cal-detail-ex">Set '+(i+1)+': '+(set.weight||'-')+' '+wtLabel()+' × '+(set.reps||'-')+', RIR '+rl+(set.failure?' ✕':'')+(set.completed?'':' (skip)')+'</div>';
        });
      });
      html+='</div>';
    });
  } else if(calSelectedDate&&!sessionMap[calSelectedDate]){
    html+='<div class="empty-state" style="padding:24px"><p>Rest day</p></div>';
  }

  container.innerHTML=html;
}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}calSelectedDate=null;renderCalendar();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}calSelectedDate=null;renderCalendar();}
function calSelectDay(dateStr){calSelectedDate=calSelectedDate===dateStr?null:dateStr;renderCalendar();}

/* ACCENT COLORS */
var ACCENT_COLORS=[
  {name:'Blue',value:'#0a84ff'},{name:'Purple',value:'#5e5ce6'},{name:'Green',value:'#30d158'},
  {name:'Red',value:'#ff453a'},{name:'Orange',value:'#ff9f0a'},{name:'Pink',value:'#ff375f'},
  {name:'Teal',value:'#64d2ff'},{name:'Yellow',value:'#ffd60a'}
];
function getAccentColor(){return localStorage.getItem(NS+'accent_color')||'#0a84ff';}
function setAccentColor(c){
  localStorage.setItem(NS+'accent_color',c);
  document.documentElement.style.setProperty('--accent',c);
  var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  document.documentElement.style.setProperty('--accent-dim','rgba('+r+','+g+','+b+',0.15)');
}
function applyAccent(){var c=getAccentColor();if(c!=='#0a84ff')setAccentColor(c);}
function renderAccentPicker(){
  var el=document.getElementById('accentPicker');if(!el)return;
  var cur=getAccentColor();
  el.innerHTML=ACCENT_COLORS.map(function(c){return '<div class="accent-swatch '+(c.value===cur?'active':'')+'" style="background:'+c.value+'" onclick="setAccentColor(\''+c.value+'\');renderSettings()" title="'+c.name+'"></div>';}).join('');
}
